<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- iOS 및 모바일 최적화: 화면 확대 방지 및 뷰포트 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>대학생 찐 공감 MBTI 테스트</title>
  
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind 커스텀 설정 및 애니메이션 (React 버전과 동일한 스타일 유지) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* iOS Safari 하단/상단 툴바 대응 동적 높이 */
    .min-h-dvh {
      min-height: 100vh;
      min-height: 100dvh;
    }
    /* Safe Area 대응 */
    .pt-safe {
      padding-top: env(safe-area-inset-top);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* 폰트 적용 (기본값) */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', sans-serif;
      /* 빠른 터치시 깜빡임 방지 */
      -webkit-tap-highlight-color: transparent; 
    }
    /* 숨김 처리 유틸리티 */
    .hidden-view { display: none !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 touch-manipulation">

  <!-- 메인 앱 컨테이너 (모바일 폼팩터 제한) -->
  <div id="app" class="flex flex-col items-center w-full min-h-dvh pb-safe">
    <div class="w-full max-w-[430px] flex-1 flex flex-col bg-white shadow-xl relative overflow-x-hidden pt-safe pt-4">
      
      <!-- ============================================== -->
      <!-- 1. INTRO SCREEN (시작 화면) -->
      <!-- ============================================== -->
      <div id="screen-intro" class="flex-1 flex flex-col justify-center items-center p-6 text-center animate-fade-in">
        <div class="mb-4 inline-block px-3 py-1 bg-blue-100 text-blue-700 text-sm font-semibold rounded-full">
          팀플/수강신청/과제
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-4 leading-tight">
          대학생 찐 공감<br/>캠퍼스 라이프 MBTI
        </h1>
        <p class="text-slate-500 mb-10 leading-relaxed text-[15px]">
          "아, 오늘 휴강각인데?"<br/>당신의 대학 생활 패턴을 분석해 드립니다.
        </p>
        <!-- 터치 타겟 최적화 (h-14) -->
        <button 
          onclick="startTest()"
          class="w-full h-14 bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all duration-200 text-white font-bold text-lg rounded-2xl shadow-lg shadow-blue-200"
        >
          테스트 시작하기
        </button>
      </div>

      <!-- ============================================== -->
      <!-- 2. TEST SCREEN (질문 화면) -->
      <!-- ============================================== -->
      <div id="screen-test" class="hidden-view flex-1 flex flex-col p-6 animate-fade-in">
        <!-- 프로그래스 바 영역 -->
        <div class="w-full mb-8 mt-2">
          <div class="flex justify-between items-end mb-2">
            <!-- 이전 버튼 -->
            <button id="btn-back" onclick="handleBack()" class="text-blue-600 font-bold text-sm flex items-center gap-1 hover:text-blue-800 transition-colors py-1 pl-0 pr-2 active:scale-95 hidden-view">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
              </svg>
              이전
            </button>
            <span id="label-progress" class="text-xs font-medium text-slate-400 pb-1">진행도</span>
            
            <span id="text-progress" class="text-xs font-medium text-slate-400 pb-1">1 / 20</span>
          </div>
          <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
            <div id="bar-progress" class="bg-blue-600 h-full rounded-full transition-all duration-300 ease-out" style="width: 5%"></div>
          </div>
        </div>

        <!-- 질문 텍스트 -->
        <div class="flex-1 flex flex-col justify-center mb-10">
          <h2 class="text-2xl font-bold text-slate-800 leading-snug break-keep">
            <span id="question-number" class="text-blue-600 mr-2">Q1.</span>
            <span id="question-text">질문 텍스트</span>
          </h2>
        </div>

        <!-- 선택지 버튼 컨테이너 -->
        <div id="options-container" class="flex flex-col gap-4 pb-4">
          <!-- JS로 동적 생성 -->
        </div>
      </div>

      <!-- ============================================== -->
      <!-- 3. RESULT SCREEN (결과 화면) -->
      <!-- ============================================== -->
      <div id="screen-result" class="hidden-view flex-1 flex flex-col p-6 overflow-y-auto pb-10">
        <!-- 결과 히어로 섹션 -->
        <div class="text-center mt-6 mb-8 animate-fade-in">
          <p class="text-sm font-semibold text-blue-600 mb-2">당신의 캠퍼스 라이프스타일</p>
          <h1 id="result-mbti" class="text-5xl font-black text-slate-900 tracking-tighter mb-4">MBTI</h1>
          <h2 id="result-title" class="text-xl font-bold text-slate-700 bg-slate-100 inline-block px-4 py-2 rounded-xl">
            서브 타이틀
          </h2>
        </div>

        <!-- 해설 카드 -->
        <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm mb-8 animate-fade-in" style="animation-delay: 0.1s;">
          <h3 class="text-sm font-bold text-slate-400 mb-3 flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
            대학 생활 요약
          </h3>
          <p id="result-desc" class="text-slate-700 leading-relaxed text-[15px] break-keep">
            해설 내용
          </p>
        </div>

        <!-- 지표별 스펙트럼 (JS로 동적 렌더링) -->
        <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm mb-8 animate-fade-in" style="animation-delay: 0.2s;">
          <h3 class="text-sm font-bold text-slate-400 mb-5 flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
            나의 세부 성향 스펙트럼
          </h3>
          <div id="spectrum-container" class="flex flex-col gap-5">
            <!-- JS 렌더링 -->
          </div>
        </div>

        <!-- 추천 활동/전공 -->
        <div class="bg-slate-50 p-5 rounded-2xl mb-8 animate-fade-in" style="animation-delay: 0.3s;">
          <h3 class="text-sm font-bold text-slate-500 mb-4 flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            추천 동아리 & 꿀조합
          </h3>
          <ul id="jobs-container" class="flex flex-col gap-3">
            <!-- JS 렌더링 -->
          </ul>
        </div>

        <!-- 액션 버튼 -->
        <div class="flex flex-col gap-3 animate-fade-in" style="animation-delay: 0.4s;">
          <button 
            onclick="handleShare()"
            class="w-full h-14 bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all duration-200 text-white font-bold text-lg rounded-2xl shadow-lg shadow-blue-200 flex items-center justify-center gap-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
            </svg>
            단톡방에 내 결과 공유하기
          </button>
          <button 
            onclick="restartTest()"
            class="w-full h-14 bg-slate-800 hover:bg-slate-900 active:scale-95 transition-all duration-200 text-white font-bold text-lg rounded-2xl shadow-lg"
          >
            테스트 다시하기
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 토스트 메시지 (숨김 상태) -->
  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800/95 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-semibold opacity-0 transition-opacity duration-300 z-50 whitespace-nowrap pointer-events-none">
    링크가 복사되었습니다!
  </div>

  <!-- ============================================== -->
  <!-- JavaScript 로직 -->
  <!-- ============================================== -->
  <script>
    // 총 20문항 (E/I 5개, S/N 5개, T/F 5개, J/P 5개) - 대학생 상황 100% 공감 질문
    const QUESTIONS = [
      // E vs I (에너지 방향 / 대인관계)
      {
        id: 1, type: 'EI',
        text: '개강 첫날, 전공 필수 수업에 들어갔는데 아는 사람이 아무도 없다. 나의 행동은?',
        options: [
          { text: '옆자리 사람에게 자연스럽게 "몇 학번이세요?" 하며 말을 걸어본다.', trait: 'E' },
          { text: '조용히 핸드폰만 보며 교수님이 들어오시길 간절히 기다린다.', trait: 'I' }
        ]
      },
      {
        id: 2, type: 'EI',
        text: '드디어 시험 끝! 동기들이 "오늘 술 마실 사람?!" 하고 단톡방에 올렸다.',
        options: [
          { text: '"나나나!! 오늘 무조건 달린다!" 바로 참석을 누르고 신나게 준비한다.', trait: 'E' },
          { text: '"아.. 피곤한데..." 핑계를 대고 집으로 돌아가 넷플릭스 보며 혼자만의 축제를 즐긴다.', trait: 'I' }
        ]
      },
      {
        id: 3, type: 'EI',
        text: '새로운 연합 동아리에 처음 나간 날, 자기소개를 해야 한다.',
        options: [
          { text: '농담도 섞어가며 여유롭게 나를 어필한다. 시선 집중 즐기는 편.', trait: 'E' },
          { text: '내 순서가 다가올수록 심장이 뛰고, 준비한 멘트만 빠르게 치고 앉는다.', trait: 'I' }
        ]
      },
      {
        id: 4, type: 'EI',
        text: '우주공강 3시간이 생겼다! 이 시간을 어떻게 보낼까?',
        options: [
          { text: '과방이나 동아리방에 가서 공강인 다른 친구들을 찾아 수다를 떤다.', trait: 'E' },
          { text: '도서관 구석이나 빈 강의실, 또는 혼자 갈 수 있는 조용한 카페를 찾는다.', trait: 'I' }
        ]
      },
      {
        id: 5, type: 'EI',
        text: '대형 강의 조별 과제, 조장을 정해야 하는 숨막히는 적막의 시간.',
        options: [
          { text: '아무도 안 하면 답답해서 "그럼 제가 할까요?" 하고 총대를 멘다.', trait: 'E' },
          { text: '절대 눈을 마주치지 않고 누군가 자원하기를 숨죽여 기다린다.', trait: 'I' }
        ]
      },
      
      // S vs N (인식 / 정보 수집)
      {
        id: 6, type: 'SN',
        text: '수강신청 전날, 시간표를 짤 때 나의 스타일은?',
        options: [
          { text: '강의평, 학점 비율, 교수님 성향 등 현실적인 데이터를 꼼꼼히 분석해 짠다.', trait: 'S' },
          { text: '"이 과목 재밌어 보이는데?" 강의명이나 느낌이 꽂히는 과목 위주로 일단 넣는다.', trait: 'N' }
        ]
      },
      {
        id: 7, type: 'SN',
        text: '교수님이 "자유 주제로 레포트를 써오세요" 라고 하셨다.',
        options: [
          { text: '너무 막막하다. 이전 선배들 자료나 구체적인 가이드라인부터 찾아본다.', trait: 'S' },
          { text: '오히려 좋아! 평소 생각했던 독특하고 창의적인 주제를 마음껏 기획해본다.', trait: 'N' }
        ]
      },
      {
        id: 8, type: 'SN',
        text: '수업 중 교수님이 딴 길로 새서 본인의 옛날 이야기를 길게 하신다.',
        options: [
          { text: '"그래서 시험 범위는 어디까지라는 거지?" 진도가 안 나가는 게 걱정된다.', trait: 'S' },
          { text: '"오 흥미로운데?" 교수님 이야기에 몰입하며 꼬리에 꼬리를 무는 상상을 한다.', trait: 'N' }
        ]
      },
      {
        id: 9, type: 'SN',
        text: '동기가 "나 자취방에서 귀신 본 것 같아" 라고 말한다.',
        options: [
          { text: '"언제? 어떻게 생겼는데? 헛것 본 거 아냐?" 사실 관계와 정황을 묻는다.', trait: 'S' },
          { text: '"헐 대박! 그래서 귀신이 너한테 뭐라고 했어? 전생에 무슨 인연 아닐까?" 상상의 나래를 편다.', trait: 'N' }
        ]
      },
      {
        id: 10, type: 'SN',
        text: '시험 공부를 할 때 나의 암기 방식은?',
        options: [
          { text: '교재에 나온 사실, 날짜, 정의를 형광펜 칠하며 정확하게 외운다.', trait: 'S' },
          { text: '전체적인 흐름이나 이론의 의미, 배경(왜 그렇게 됐는지)을 위주로 이해한다.', trait: 'N' }
        ]
      },

      // T vs F (판단 / 결정)
      {
        id: 11, type: 'TF',
        text: '동기가 "나 이번 과제 너무 어려워서 밤샜는데 C+ 받았어 ㅠㅠ" 하며 우울해한다.',
        options: [
          { text: '"헐.. 기준이 뭐였어? 교수님한테 성적 이의신청 메일 보내봤어?" 해결책을 찾는다.', trait: 'T' },
          { text: '"아이고 ㅠㅠ 밤까지 샜는데 진짜 속상하겠다.. 밥이나 먹으러 가자!" 공감과 위로를 한다.', trait: 'F' }
        ]
      },
      {
        id: 12, type: 'TF',
        text: '조별 과제 중 한 명이 "개인 사정으로 이번 모임 빠질게요" 라고 한다.',
        options: [
          { text: '"그럼 그 분이 맡은 파트는 어떻게 되나요? 명확한 분담이 필요할 것 같아요." 공정성이 우선이다.', trait: 'T' },
          { text: '"무슨 일 있으신가? 괜찮으신가요? 저희가 조금 더 할게요." 상황을 이해하려 한다.', trait: 'F' }
        ]
      },
      {
        id: 13, type: 'TF',
        text: '친구가 나에게 "너는 참 팩트 폭행을 잘해~" 라고 농담을 건넸다.',
        options: [
          { text: '(내심 뿌듯) "내가 좀 논리적이고 객관적이긴 하지." 칭찬으로 받아들인다.', trait: 'T' },
          { text: '(뜨끔) "내가 너무 차갑게 말했나? 상처받은 건 아니겠지?" 내 말투를 되돌아본다.', trait: 'F' }
        ]
      },
      {
        id: 14, type: 'TF',
        text: '교수님께 추천서를 부탁드리러 갔다. 어떤 교수님께 갈까?',
        options: [
          { text: '나의 학점과 성과를 객관적으로 높이 평가해 주시는 깐깐한 전공 교수님.', trait: 'T' },
          { text: '성적은 좀 낮아도, 평소 나를 예뻐해 주시고 내 잠재력을 믿어주시는 교수님.', trait: 'F' }
        ]
      },
      {
        id: 15, type: 'TF',
        text: '룸메이트와 다투었다. 화해를 위해 먼저 말을 꺼낼 때.',
        options: [
          { text: '"우리가 싸운 이유는 생활 패턴 차이인 것 같아. 룰을 다시 정하자." 원인과 대안 제시.', trait: 'T' },
          { text: '"아까 내가 말 심하게 해서 미안해. 마음 상했지?" 감정을 먼저 다독임.', trait: 'F' }
        ]
      },

      // J vs P (생활 양식 / 대처)
      {
        id: 16, type: 'JP',
        text: '시험 2주 전, 나의 공부 계획은?',
        options: [
          { text: '요일별로 과목과 범위를 쪼개서 플래너에 다 적어두고 그대로 실천한다.', trait: 'J' },
          { text: '"아직 2주나 남았네!" 대략적인 마음의 준비만 하고 며칠 전부터 벼락치기 발동을 건다.', trait: 'P' }
        ]
      },
      {
        id: 17, type: 'JP',
        text: '동기들과 즉흥적으로 당일치기 바다 여행을 가기로 했다!',
        options: [
          { text: '즉흥? 불안한데.. 가는 길에 버스 시간, 맛집 리스트, 동선을 빠르게 검색해서 짠다.', trait: 'J' },
          { text: '와 신난다!! 무계획이 계획이지! 일단 가서 발길 닿는 대로 놀고 먹는다.', trait: 'P' }
        ]
      },
      {
        id: 18, type: 'JP',
        text: '자취방이나 기숙사 내 방의 상태는?',
        options: [
          { text: '물건의 자리가 정해져 있고, 외출 후에는 항상 원래 상태로 깔끔하게 정리한다.', trait: 'J' },
          { text: '옷 무덤이 생기긴 하지만, 그 안에서도 나만의 질서가 있어 물건은 잘 찾는다.', trait: 'P' }
        ]
      },
      {
        id: 19, type: 'JP',
        text: '과제 제출 마감일이 내일 밤 11시 59분이다.',
        options: [
          { text: '미리 완성해두고 검토까지 끝냈다. 서버 터질까 봐 저녁 먹기 전에 안전하게 낸다.', trait: 'J' },
          { text: '11시 50분까지 폭풍 타이핑! 아드레날린 분비를 즐기며 58분에 스릴 있게 제출한다.', trait: 'P' }
        ]
      },
      {
        id: 20, type: 'JP',
        text: '오늘 할 일을 다 끝내지 못하고 자야 할 때 기분은?',
        options: [
          { text: '계획대로 못 한 나 자신에게 짜증이 나고 찝찝해서 잠이 잘 안 온다.', trait: 'J' },
          { text: '"뭐 어때~ 내일의 내가 하겠지!" 미련 없이 쿨하게 숙면에 빠진다.', trait: 'P' }
        ]
      }
    ];

    // 대학생 상황에 맞춘 16가지 MBTI 결과 데이터
    const RESULTS_DATA = {
      ESTJ: {
        title: '에이쁠 불도저, 과대 재질',
        desc: '팀플에서 답답함을 참지 못하고 결국 조장을 맡아 캐리하는 스타일입니다. 확실한 목표(학점, 스펙)가 있으면 무서운 추진력으로 달성합니다. 엑셀로 일정을 정리하고 캘린더를 꽉꽉 채워야 마음이 편안한 캠퍼스의 갓생러입니다.',
        jobs: [
          { name: '추천 동아리: 경영전략/마케팅 학회', reason: '체계적인 분석과 리더십을 발휘할 수 있는 곳' },
          { name: '꿀조합: 묵묵히 내 말 잘 따라주는 조원', reason: '지시를 잘 이행하는 팀원과 최고의 시너지' }
        ]
      },
      ENFP: {
        title: '인싸 중의 핵인싸, 캠퍼스 에너자이저',
        desc: '동아리 방에 가면 항상 있는 사람! 새로운 사람을 만나는 걸 좋아하고 호기심이 많아 수많은 활동에 발을 걸치고 있습니다. 벼락치기 장인이지만 위기 대처 능력이 뛰어나 어떻게든 과제를 막아냅니다. 자유로운 영혼 그 자체입니다.',
        jobs: [
          { name: '추천 동아리: 연합 밴드/축제 기획단', reason: '끼를 발산하고 많은 사람들과 어울리는 활동' },
          { name: '꿀조합: 내 일정 챙겨주는 J형 친구', reason: '정신없는 내 스케줄을 정리해줄 구원자' }
        ]
      },
      ISTJ: {
        title: '도서관 지박령, 흔들림 없는 팩트 폭격기',
        desc: '강의계획서를 가장 꼼꼼히 읽는 사람입니다. 출석과 과제 제출 기한을 절대 어기지 않으며, 벼락치기보다는 꾸준한 복습을 선호합니다. 화려한 대학 생활보다는 학점 관리와 스펙 쌓기 등 본인의 앞가림을 묵묵히 해내는 모범생입니다.',
        jobs: [
          { name: '추천 동아리: 고시반 / 투자 동아리', reason: '조용히 실속을 챙기고 규칙적인 활동' },
          { name: '꿀조합: 무임승차 절대 안 하는 모범생', reason: '각자 맡은 바 다하는 깔끔한 관계' }
        ]
      },
      INFP: {
        title: '방구석 몽상가, 캠퍼스 감성 장인',
        desc: '창가 자리에 앉아 음악을 들으며 캠퍼스 낭만을 즐기는 스타일입니다. 다수가 모이는 시끌벅적한 술자리보다는 마음 맞는 한두 명의 동기 깊은 대화를 나누는 걸 좋아합니다. 과제에 삘(Feel)이 꽂히면 누구보다 멋진 결과물을 내지만, 그렇지 않으면 시작조차 힘들어합니다.',
        jobs: [
          { name: '추천 동아리: 영화 감상 / 문예 창작 동아리', reason: '나만의 감성과 상상력을 표출할 수 있는 곳' },
          { name: '꿀조합: 내 말을 끝까지 들어주는 룸메', reason: '감정선이 통하고 서로 배려하는 사이' }
        ]
      },
      ENTP: {
        title: '말빨 원탑, 교수님과의 토론 배틀러',
        desc: '수업 시간에 날카로운 질문으로 정적을 깨는 사람입니다. 아이디어가 넘치고 기발해서 조별 과제에서 기획을 주로 맡습니다. 반복적이고 단순한 암기 과목은 질색하지만, 논리가 필요한 과목이나 토론에서는 압도적인 퍼포먼스를 보여줍니다.',
        jobs: [
          { name: '추천 동아리: 토론 동아리 / 스타트업 학회', reason: '자신의 주장을 논리적으로 펼치고 기획하는 곳' },
          { name: '꿀조합: 내 엉뚱한 아이디어 구체화해줄 J', reason: '말만 앞서는 나를 현실로 끌어내줄 사람' }
        ]
      },
      ISFJ: {
        title: '조별과제 숨은 천사, 보부상 재질',
        desc: '가방에 물티슈, 밴드, 충전기까지 다 들고 다니는 동기들의 든든한 어머니 같은 존재입니다. 팀플 시 나대지 않지만 맡은 파트는 완벽하게 해내며 PPT 디자인이나 오타 검수 같은 디테일한 작업을 아주 잘합니다. 거절을 잘 못해서 손해 보는 경우도 종종 있습니다.',
        jobs: [
          { name: '추천 동아리: 중앙 봉사 동아리 / 멘토링 단단', reason: '타인을 돕고 소속감을 느낄 수 있는 따뜻한 곳' },
          { name: '꿀조합: 내 호의를 고마워할 줄 아는 다정한 F', reason: '서로 상처 안 주고 챙겨주는 관계' }
        ]
      },
      // Fallback 처리 (나머지 유형)
      DEFAULT: {
        title: '슬기로운 캠퍼스 라이프, 밸런스형 대학생',
        desc: '놀 때는 놀고 할 때는 하는, 밸런스 붕괴 없는 슬기로운 대학 생활을 하고 있습니다. 상황에 따라 인싸가 되기도 하고 자발적 아싸가 되기도 하며 유연하게 대처합니다. 동기들과 원만한 관계를 유지하며 자신만의 페이스로 캠퍼스 라이프를 즐기고 있네요!',
        jobs: [
          { name: '추천 활동: 교환학생 / 국토대장정', reason: '새로운 환경에서도 유연하게 적응할 수 있는 능력' },
          { name: '꿀조합: 선 넘지 않고 배려하는 동기', reason: '적당한 거리감을 유지하며 편안한 관계' }
        ]
      }
    };

    let currentIdx = 0;
    let answers = []; // 사용자가 선택한 답변(성향)을 저장하는 배열

    // DOM 요소 캐싱
    const screenIntro = document.getElementById('screen-intro');
    const screenTest = document.getElementById('screen-test');
    const screenResult = document.getElementById('screen-result');
    const questionText = document.getElementById('question-text');
    const questionNumber = document.getElementById('question-number');
    const optionsContainer = document.getElementById('options-container');
    const barProgress = document.getElementById('bar-progress');
    const textProgress = document.getElementById('text-progress');
    const btnBack = document.getElementById('btn-back');
    const labelProgress = document.getElementById('label-progress');

    // 테스트 시작
    function startTest() {
      screenIntro.classList.add('hidden-view');
      screenTest.classList.remove('hidden-view');
      currentIdx = 0;
      answers = [];
      renderQuestion();
    }

    // 질문 화면 렌더링
    function renderQuestion() {
      const q = QUESTIONS[currentIdx];
      
      // 상단 프로그래스 바 업데이트
      questionNumber.innerText = `Q${q.id}.`;
      questionText.innerText = q.text;
      textProgress.innerText = `${currentIdx + 1} / ${QUESTIONS.length}`;
      barProgress.style.width = `${((currentIdx + 1) / QUESTIONS.length) * 100}%`;

      // 첫 문제일 때 '이전' 버튼 숨김 / 그 외 노출
      if (currentIdx === 0) {
        btnBack.classList.add('hidden-view');
        labelProgress.classList.remove('hidden-view');
      } else {
        btnBack.classList.remove('hidden-view');
        labelProgress.classList.add('hidden-view');
      }

      // 선택지 버튼 동적 생성
      optionsContainer.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        // iOS 카드형 디자인, 충분한 터치 영역(min-h-[64px], p-5)
        btn.className = "w-full min-h-[64px] text-left p-5 bg-white border border-slate-200 hover:border-blue-400 hover:bg-blue-50 active:scale-[0.98] transition-all duration-200 rounded-2xl shadow-sm text-slate-700 font-medium leading-relaxed";
        btn.innerText = opt.text;
        btn.onclick = () => handleAnswer(opt.trait);
        optionsContainer.appendChild(btn);
      });
    }

    // 답변 선택 처리
    function handleAnswer(trait) {
      // 현재 인덱스에 해당하는 위치에 답변 기록 (이전으로 돌아가서 재선택 시 덮어쓰기 위해)
      answers[currentIdx] = trait;

      if (currentIdx < QUESTIONS.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        calculateResult();
      }
    }

    // 이전 질문으로 돌아가기
    function handleBack() {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    }

    // 결과 계산 및 화면 전환
    function calculateResult() {
      const finalScores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
      
      // 저장된 답변 배열을 순회하며 점수 합산
      answers.forEach(trait => {
        if (finalScores[trait] !== undefined) {
          finalScores[trait] += 1;
        }
      });

      // 유형 도출 (동점 시 기본값)
      const typeE = finalScores.E >= finalScores.I ? 'E' : 'I';
      const typeS = finalScores.S >= finalScores.N ? 'S' : 'N';
      const typeT = finalScores.T >= finalScores.F ? 'T' : 'F';
      const typeJ = finalScores.J >= finalScores.P ? 'J' : 'P';
      const mbtiType = `${typeE}${typeS}${typeT}${typeJ}`;

      // 백분율 계산 헬퍼 함수
      const getPercent = (val1, val2) => {
        const total = val1 + val2;
        if (total === 0) return 50;
        return Math.round((val1 / total) * 100);
      };

      const percentages = {
        EI: { left: getPercent(finalScores.E, finalScores.I), right: getPercent(finalScores.I, finalScores.E), labelLeft: 'E (외향)', labelRight: 'I (내향)' },
        SN: { left: getPercent(finalScores.S, finalScores.N), right: getPercent(finalScores.N, finalScores.S), labelLeft: 'S (현실)', labelRight: 'N (직관)' },
        TF: { left: getPercent(finalScores.T, finalScores.F), right: getPercent(finalScores.F, finalScores.T), labelLeft: 'T (이성)', labelRight: 'F (공감)' },
        JP: { left: getPercent(finalScores.J, finalScores.P), right: getPercent(finalScores.P, finalScores.J), labelLeft: 'J (계획)', labelRight: 'P (즉흥)' },
      };

      const resultDetail = RESULTS_DATA[mbtiType] || RESULTS_DATA['DEFAULT'];

      renderResult(mbtiType, percentages, resultDetail);
    }

    function renderResult(mbti, percentages, detail) {
      screenTest.classList.add('hidden-view');
      screenResult.classList.remove('hidden-view');

      document.getElementById('result-mbti').innerText = mbti;
      document.getElementById('result-title').innerText = detail.title;
      document.getElementById('result-desc').innerText = detail.desc;

      // 스펙트럼 바 렌더링
      const spectrumContainer = document.getElementById('spectrum-container');
      spectrumContainer.innerHTML = '';
      
      Object.keys(percentages).forEach(key => {
        const data = percentages[key];
        const isLeftDom = data.left > data.right;
        const isRightDom = data.right >= data.left;
        
        const div = document.createElement('div');
        div.className = "flex flex-col gap-1.5";
        div.innerHTML = `
          <div class="flex justify-between text-xs font-bold text-slate-500">
            <span class="${isLeftDom ? 'text-blue-600 text-sm' : ''}">${data.labelLeft} ${data.left}%</span>
            <span class="${isRightDom ? 'text-indigo-600 text-sm' : ''}">${data.right}% ${data.labelRight}</span>
          </div>
          <div class="relative w-full h-3 bg-slate-100 rounded-full overflow-hidden">
            <div class="absolute top-0 left-0 h-full bg-gradient-to-r from-blue-500 to-indigo-400 rounded-full transition-all duration-1000 ease-out"
                 style="width: 0%"></div>
          </div>
        `;
        spectrumContainer.appendChild(div);
        
        // 애니메이션 효과를 위해 약간의 딜레이 후 width 적용
        setTimeout(() => {
          div.querySelector('.bg-gradient-to-r').style.width = `${data.left}%`;
        }, 100);
      });

      // 직업(동아리/꿀조합) 렌더링
      const jobsContainer = document.getElementById('jobs-container');
      jobsContainer.innerHTML = '';
      detail.jobs.forEach(job => {
        const li = document.createElement('li');
        li.className = "bg-white p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col gap-1";
        li.innerHTML = `
          <span class="font-bold text-slate-800 text-[15px]">${job.name}</span>
          <span class="text-xs text-slate-500 leading-normal">${job.reason}</span>
        `;
        jobsContainer.appendChild(li);
      });
      
      // 결과 창 맨 위로 스크롤
      window.scrollTo(0,0);
    }

    // 공유 기능 (Web Share API 지원 시 네이티브 UI 팝업, 미지원 시 클립보드 복사)
    async function handleShare() {
      const shareData = {
        title: '캠퍼스 라이프 MBTI 테스트',
        text: '나의 대학 생활 MBTI 결과를 확인해보세요!',
        url: window.location.href,
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          console.log('공유 취소됨');
        }
      } else {
        // Fallback: 클립보드 복사
        copyToClipboard(window.location.href);
        showToast();
      }
    }

    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, 2500);
    }

    // 처음으로 돌아가기
    function restartTest() {
      screenResult.classList.add('hidden-view');
      screenIntro.classList.remove('hidden-view');
      window.scrollTo(0,0);
    }
  </script>
