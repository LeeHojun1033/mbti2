<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- iOS 및 모바일 최적화: 화면 확대 방지 및 뷰포트 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>간호대생 찐 공감 생존형 MBTI</title>
  
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- html2canvas 라이브러리 (이미지 캡처용) -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  
  <!-- Tailwind 커스텀 설정 및 애니메이션 (React 버전과 동일한 스타일 유지) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* iOS Safari 하단/상단 툴바 대응 동적 높이 */
    .min-h-dvh {
      min-height: 100vh;
      min-height: 100dvh;
    }
    /* Safe Area 대응 */
    .pt-safe {
      padding-top: env(safe-area-inset-top);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* 폰트 적용 (기본값) */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', sans-serif;
      /* 빠른 터치시 깜빡임 방지 */
      -webkit-tap-highlight-color: transparent; 
    }
    /* 숨김 처리 유틸리티 */
    .hidden-view { display: none !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 touch-manipulation">

  <!-- 메인 앱 컨테이너 (모바일 폼팩터 제한) -->
  <div id="app" class="flex flex-col items-center w-full min-h-dvh pb-safe">
    <div class="w-full max-w-[430px] flex-1 flex flex-col bg-white shadow-xl relative overflow-x-hidden pt-safe pt-4">
      
      <!-- ============================================== -->
      <!-- 1. INTRO SCREEN (시작 화면) -->
      <!-- ============================================== -->
      <div id="screen-intro" class="flex-1 flex flex-col justify-center items-center p-6 text-center animate-fade-in">
        <div class="mb-4 inline-block px-3 py-1 bg-blue-100 text-blue-700 text-sm font-semibold rounded-full">
          실습/국시/케이스/연애
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-4 leading-tight">
          간호대생 찐 공감<br/>생존형 MBTI
        </h1>
        <p class="text-slate-500 mb-10 leading-relaxed text-[15px]">
          "아, 낼 데이(Day) 출근인데..."<br/>당신의 간호학과 라이프스타일을 분석해 드립니다.
        </p>
        <!-- 터치 타겟 최적화 (h-14) -->
        <button 
          onclick="startTest()"
          class="w-full h-14 bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all duration-200 text-white font-bold text-lg rounded-2xl shadow-lg shadow-blue-200"
        >
          테스트 시작하기
        </button>
      </div>

      <!-- ============================================== -->
      <!-- 2. TEST SCREEN (질문 화면) -->
      <!-- ============================================== -->
      <div id="screen-test" class="hidden-view flex-1 flex flex-col p-6 animate-fade-in">
        <!-- 프로그래스 바 영역 -->
        <div class="w-full mb-8 mt-2">
          <div class="flex justify-between items-end mb-2">
            <!-- 이전 버튼 -->
            <button id="btn-back" onclick="handleBack()" class="text-blue-600 font-bold text-sm flex items-center gap-1 hover:text-blue-800 transition-colors py-1 pl-0 pr-2 active:scale-95 hidden-view">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
              </svg>
              이전
            </button>
            <span id="label-progress" class="text-xs font-medium text-slate-400 pb-1">진행도</span>
            
            <span id="text-progress" class="text-xs font-medium text-slate-400 pb-1">1 / 20</span>
          </div>
          <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
            <div id="bar-progress" class="bg-blue-600 h-full rounded-full transition-all duration-300 ease-out" style="width: 5%"></div>
          </div>
        </div>

        <!-- 질문 텍스트 -->
        <div class="flex-1 flex flex-col justify-center mb-10">
          <h2 class="text-2xl font-bold text-slate-800 leading-snug break-keep">
            <span id="question-number" class="text-blue-600 mr-2">Q1.</span>
            <span id="question-text">질문 텍스트</span>
          </h2>
        </div>

        <!-- 선택지 버튼 컨테이너 -->
        <div id="options-container" class="flex flex-col gap-4 pb-4">
          <!-- JS로 동적 생성 -->
        </div>
      </div>

      <!-- ============================================== -->
      <!-- 3. RESULT SCREEN (결과 화면) -->
      <!-- ============================================== -->
      <div id="screen-result" class="hidden-view flex-1 flex flex-col overflow-y-auto pb-10">
        
        <!-- 이미지로 캡처될 영역 (버튼 완벽 제외, 딱 콘텐츠 높이만큼만 캡처) -->
        <div id="capture-area" class="bg-slate-100 px-6 pt-6 pb-4 flex-none">
          
          <!-- 1) 결과 히어로 섹션 -->
          <div class="text-center mt-6 mb-8 animate-fade-in">
            <p class="text-sm font-semibold text-blue-600 mb-2">당신의 캠퍼스 라이프스타일</p>
            <h1 id="result-mbti" class="text-5xl font-black text-slate-900 tracking-tighter mb-4">MBTI</h1>
            <h2 id="result-title" class="text-lg font-bold text-slate-700 bg-white border border-slate-200 inline-block px-4 py-2 rounded-xl shadow-sm">결과 타이틀</h2>
          </div>

          <!-- 2) 해설 카드 -->
          <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm mb-6 animate-fade-in" style="animation-delay: 0.1s;">
            <h3 class="text-sm font-bold text-slate-400 mb-3 flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
              대학 생활 요약
            </h3>
            <p id="result-desc" class="text-slate-700 leading-relaxed text-[15px] break-keep">
              해설 내용
            </p>
          </div>

          <!-- 3) 지표별 스펙트럼 (독립된 카드로 분리) -->
          <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm mb-6 animate-fade-in" style="animation-delay: 0.2s;">
            <h3 class="text-sm font-bold text-slate-400 mb-5 flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
              나의 세부 성향 스펙트럼
            </h3>
            <div id="spectrum-container" class="flex flex-col gap-5">
              <!-- JS 렌더링 -->
            </div>
          </div>

          <!-- 4) 추천 활동/전공 (스펙트럼 밖으로 꺼내서 독립된 카드로 분리) -->
          <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm mb-2 animate-fade-in" style="animation-delay: 0.3s;">
            <h3 class="text-sm font-bold text-slate-500 mb-4 flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              추천 동아리 & 꿀조합
            </h3>
            <ul id="jobs-container" class="flex flex-col gap-3">
              <!-- JS 렌더링 -->
            </ul>
          </div>
          
        </div> <!-- 캡처 영역 여기서 확실히 닫기! (capture-area 끝) -->

        <!-- 액션 버튼 (캡처 영역 밖으로 완전히 분리됨) -->
        <div class="flex flex-col gap-3 px-6 pt-5 animate-fade-in" style="animation-delay: 0.4s;">
          <button 
            onclick="handleImageDownload()"
            class="w-full h-14 bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all duration-200 text-white font-bold text-lg rounded-2xl shadow-lg shadow-blue-200 flex items-center justify-center gap-2"
          >
            <!-- 다운로드 아이콘 -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            결과 이미지로 저장하기
          </button>
          
          <!-- 내 결과를 공유하는 카카오톡 테마 버튼으로 수정 -->
          <button 
            onclick="handleResultShare()"
            class="w-full h-14 bg-[#FEE500] hover:bg-[#FADA0A] active:scale-95 transition-all duration-200 text-[#000000] font-bold text-lg rounded-2xl shadow-lg flex items-center justify-center gap-2"
          >
            <!-- 공유 아이콘 -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
            </svg>
            결과 공유하기
          </button>

          <button 
            onclick="restartTest()"
            class="w-full h-14 bg-slate-800 hover:bg-slate-900 active:scale-95 transition-all duration-200 text-white font-bold text-lg rounded-2xl shadow-lg"
          >
            테스트 다시하기
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 토스트 메시지 (숨김 상태) -->
  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800/95 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-semibold opacity-0 transition-opacity duration-300 z-50 whitespace-nowrap pointer-events-none">
    링크가 복사되었습니다!
  </div>

  <!-- ============================================== -->
  <!-- JavaScript 로직 -->
  <!-- ============================================== -->
  <script>
    // 총 20문항 (E/I 5개, S/N 5개, T/F 5개, J/P 5개) - 간호학과 상황 + 연애 4문항
    const QUESTIONS = [
      // E vs I (에너지 방향 / 대인관계)
      {
        id: 1, type: 'EI',
        text: '드디어 첫 임상실습 나가는 날! 병동 스테이션에 도착한 나의 모습은?',
        options: [
          { text: '선생님들께 먼저 다가가 밝게 인사하며 눈도장을 확실히 찍는다.', trait: 'E' },
          { text: '최대한 구석에 병풍처럼 서서 눈치껏 병동 분위기와 동선을 파악한다.', trait: 'I' }
        ]
      },
      {
        id: 2, type: 'EI',
        text: '지옥의 케이스 스터디 끝! 실습 조원들과 회식 제안이 나왔다.',
        options: [
          { text: '"무조건 가야지! 오늘 실습 썰 풀면서 달려!" 신나게 참석한다.', trait: 'E' },
          { text: '"아.. 저 오늘 너무 피곤해서 ㅠㅠ" 핑계를 대고 집으로 도망쳐 기절한다.', trait: 'I' }
        ]
      },
      {
        id: 3, type: 'EI',
        text: '💝 실습과 국시 준비로 바쁜 와중, 마음에 드는 사람과 썸을 타게 되었다!',
        options: [
          { text: '"이번 오프 때 뭐해?" 먼저 적극적으로 연락하고 만날 약속을 잡는다.', trait: 'E' },
          { text: '연락이 오길 기다리며 인스타 스토리만 염탐하고 조용히 호감을 키운다.', trait: 'I' }
        ]
      },
      {
        id: 4, type: 'EI',
        text: '교내 기본간호학 핵심술기 시간, 환자 역할과 간호사 역할을 정해야 한다.',
        options: [
          { text: '"제가 먼저 간호사 해볼게요!" 나서서 술기를 시도해 본다.', trait: 'E' },
          { text: '일단 환자 역할로 누워서 다른 친구가 하는 걸 지켜보며 시뮬레이션한다.', trait: 'I' }
        ]
      },
      {
        id: 5, type: 'EI',
        text: '기다리던 나이팅게일 선서식(나선식)이 끝났다. 기념사진 찍는 시간!',
        options: [
          { text: '여기저기 돌아다니며 동기들, 교수님과 셀카를 100장 남긴다.', trait: 'E' },
          { text: '친한 무리와만 빠르게 사진을 찍고 가족들과 조용히 시간을 보낸다.', trait: 'I' }
        ]
      },
      
      // S vs N (인식 / 정보 수집)
      {
        id: 6, type: 'SN',
        text: '성인간호학의 방대한 시험 범위를 마주했다. 나의 공부 스타일은?',
        options: [
          { text: '교수님이 찝어준 PPT 내용과 기출문제를 반복해서 정확하게 암기한다.', trait: 'S' },
          { text: '인체의 질병 기전과 원인을 전체적인 흐름으로 먼저 이해하려 한다.', trait: 'N' }
        ]
      },
      {
        id: 7, type: 'SN',
        text: '실습 중 처음으로 환자의 V/S(활력징후)를 재러 갔을 때 드는 생각은?',
        options: [
          { text: '"수축기 120, 이완기 80.. 맥박 72.. 수치 정확하게 EMR에 기록해야지."', trait: 'S' },
          { text: '"환자분 표정이 안 좋으신데 어디 아프신가? 어제 못 주무셨나?" 상상의 나래를 편다.', trait: 'N' }
        ]
      },
      {
        id: 8, type: 'SN',
        text: '💝 애인과 데이트 중, 애인이 "우리 졸업하고 같은 병원 발령나면 어떨까?" 묻는다.',
        options: [
          { text: '"듀티(교대근무) 다르면 어차피 얼굴도 못 봐. 오프 맞추기 헬일걸?" 현실을 짚어준다.', trait: 'S' },
          { text: '"퇴근하고 같이 병원 앞 포장마차에서 맥주 마시면 진짜 낭만적이겠다!" 상상하며 설렌다.', trait: 'N' }
        ]
      },
      {
        id: 9, type: 'SN',
        text: '핵심술기 평가(정맥주사 등)를 앞두고 오픈랩에서 연습할 때 나는?',
        options: [
          { text: '체크리스트 순서에 맞게 물품 준비부터 마무리까지 기계처럼 외운다.', trait: 'S' },
          { text: '실제 환자에게 한다고 상상하며 감정을 이입해 멘트와 리액션까지 연기한다.', trait: 'N' }
        ]
      },
      {
        id: 10, type: 'SN',
        text: '교수님이 수업 중 딴 길로 새서 본인의 신규 간호사 시절 썰을 푸신다.',
        options: [
          { text: '"그래서 저 부분이 시험에 나온다는 건가?" 진도가 안 나가는 게 초조하다.', trait: 'S' },
          { text: '"오 대박! 임상 나가면 저런 일도 있구나!" 과몰입하며 흥미롭게 듣는다.', trait: 'N' }
        ]
      },

      // T vs F (판단 / 결정)
      {
        id: 11, type: 'TF',
        text: '실습 중 동기가 수간호사 선생님께 크게 혼나고 휴게실에서 울고 있다.',
        options: [
          { text: '"어떤 거 때문에 혼났어? 다음엔 꼭 인수인계장에 미리 적어둬." 해결책을 같이 찾는다.', trait: 'T' },
          { text: '"헐 어떡해 ㅠㅠ 수선생님 너무하네 진짜 고생 많았어.." 일단 껴안고 같이 욕해준다.', trait: 'F' }
        ]
      },
      {
        id: 12, type: 'TF',
        text: '밤새워 힘들게 쓴 케이스 스터디(간호과정). 교수님이 피드백으로 붉은 줄을 쫙 그어주셨다.',
        options: [
          { text: '"아하, 간호진단 우선순위가 틀렸구나. 피드백대로 수정해야지." 논리적으로 납득한다.', trait: 'T' },
          { text: '"(쿠궁) 내 노력이 부정당한 기분.. 너무 속상하다..." 피드백을 내심 상처로 받아들인다.', trait: 'F' }
        ]
      },
      {
        id: 13, type: 'TF',
        text: '💝 애인이 "나 오늘 모의고사 점수 떨어져서 너무 우울해 ㅠㅠ" 라고 카톡을 보냈다.',
        options: [
          { text: '"어느 과목이 점수 젤 낮아? 오답 노트는 했어? 부족한 파트 위주로 다시 파보자." 피드백을 준다.', trait: 'T' },
          { text: '"아이고 ㅠㅠ 공부하느라 진짜 고생했는데 속상하겠다.. 오늘 맛있는 거 먹자!" 공감해준다.', trait: 'F' }
        ]
      },
      {
        id: 14, type: 'TF',
        text: '팀플 컨퍼런스 준비 중, 한 조원이 "저 오늘 알바 때문에 자료 조사 못할 거 같아요"라고 한다.',
        options: [
          { text: '"그럼 역할 분담을 다시 해야겠네요. 이름은 뺄게요." 규칙과 공정성이 우선이다.', trait: 'T' },
          { text: '"무슨 일 있으신가? 어쩔 수 없죠, 저희가 조금 더 나눠서 할게요." 상황을 이해하려 한다.', trait: 'F' }
        ]
      },

    // 테스트 시작
    function startTest() {
      screenIntro.classList.add('hidden-view');

      currentIdx = 0;
      answers = [];

    }

    // 질문 화면 렌더링
    function renderQuestion() {
      const q = QUESTIONS[currentIdx];
      
      // 상단 프로그래스 바 업데이트
      questionNumber.innerText = `Q${q.id}.`;
      questionText.innerText = q.text;
      textProgress.innerText = `${currentIdx + 1} / ${QUESTIONS.length}`;
      barProgress.style.width = `${((currentIdx + 1) / QUESTIONS.length) * 100}%`;

      // 첫 문제일 때 '이전' 버튼 숨김 / 그 외 노출
      if (currentIdx === 0) {
        btnBack.classList.add('hidden-view');
        labelProgress.classList.remove('hidden-view');
      } else {
        btnBack.classList.remove('hidden-view');
        labelProgress.classList.add('hidden-view');
      }

      // 선택지 버튼 동적 생성
      optionsContainer.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        // iOS 카드형 디자인, 충분한 터치 영역(min-h-[64px], p-5)
        btn.className = "w-full min-h-[64px] text-left p-5 bg-white border border-slate-200 hover:border-blue-400 hover:bg-blue-50 active:scale-[0.98] transition-all duration-200 rounded-2xl shadow-sm text-slate-700 font-medium leading-relaxed";
        btn.innerText = opt.text;
        btn.onclick = () => handleAnswer(opt.trait);
        optionsContainer.appendChild(btn);
      });
    }

    // 답변 선택 처리
    function handleAnswer(trait) {
      // 현재 인덱스에 해당하는 위치에 답변 기록 (이전으로 돌아가서 재선택 시 덮어쓰기 위해)
      answers[currentIdx] = trait;

      if (currentIdx < QUESTIONS.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        calculateResult();
      }
    }

    // 이전 질문으로 돌아가기
    function handleBack() {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    }

    // 결과 계산 및 화면 전환
    function calculateResult() {
      const finalScores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
      
      // 저장된 답변 배열을 순회하며 점수 합산
      answers.forEach(trait => {
        if (finalScores[trait] !== undefined) {
          finalScores[trait] += 1;
        }
      });

      // 유형 도출 (동점 시 기본값)
      const typeE = finalScores.E >= finalScores.I ? 'E' : 'I';
      const typeS = finalScores.S >= finalScores.N ? 'S' : 'N';
      const typeT = finalScores.T >= finalScores.F ? 'T' : 'F';
      const typeJ = finalScores.J >= finalScores.P ? 'J' : 'P';
      const mbtiType = `${typeE}${typeS}${typeT}${typeJ}`;

      // 백분율 계산 헬퍼 함수
      const getPercent = (val1, val2) => {
        const total = val1 + val2;
        if (total === 0) return 50;
        return Math.round((val1 / total) * 100);
      };

      const percentages = {
        EI: { left: getPercent(finalScores.E, finalScores.I), right: getPercent(finalScores.I, finalScores.E), labelLeft: 'E (외향)', labelRight: 'I (내향)' },
        SN: { left: getPercent(finalScores.S, finalScores.N), right: getPercent(finalScores.N, finalScores.S), labelLeft: 'S (현실)', labelRight: 'N (직관)' },
        TF: { left: getPercent(finalScores.T, finalScores.F), right: getPercent(finalScores.F, finalScores.T), labelLeft: 'T (이성)', labelRight: 'F (공감)' },
        JP: { left: getPercent(finalScores.J, finalScores.P), right: getPercent(finalScores.P, finalScores.J), labelLeft: 'J (계획)', labelRight: 'P (즉흥)' },
      };

      const resultDetail = RESULTS_DATA[mbtiType] || RESULTS_DATA['DEFAULT'];

      renderResult(mbtiType, percentages, resultDetail);
    }

    function renderResult(mbti, percentages, detail) {
      screenTest.classList.add('hidden-view');
      screenResult.classList.remove('hidden-view');

      document.getElementById('result-mbti').innerText = mbti;
      document.getElementById('result-title').innerText = detail.title;
      document.getElementById('result-desc').innerText = detail.desc;

      // 스펙트럼 바 렌더링
      const spectrumContainer = document.getElementById('spectrum-container');
      spectrumContainer.innerHTML = '';
      
      Object.keys(percentages).forEach(key => {
        const data = percentages[key];
        const isLeftDom = data.left > data.right;
        const isRightDom = data.right >= data.left;
        
        const div = document.createElement('div');
        div.className = "flex flex-col gap-1.5";
        div.innerHTML = `
          <div class="flex justify-between text-xs font-bold text-slate-500">
            <span class="${isLeftDom ? 'text-blue-600 text-sm' : ''}">${data.labelLeft} ${data.left}%</span>
            <span class="${isRightDom ? 'text-indigo-600 text-sm' : ''}">${data.right}% ${data.labelRight}</span>
          </div>
          <div class="relative w-full h-3 bg-slate-100 rounded-full overflow-hidden">
            <div class="absolute top-0 left-0 h-full bg-gradient-to-r from-blue-500 to-indigo-400 rounded-full transition-all duration-1000 ease-out"
                 style="width: 0%"></div>
          </div>
        `;
        spectrumContainer.appendChild(div);
        
        // 애니메이션 효과를 위해 약간의 딜레이 후 width 적용
        setTimeout(() => {
          div.querySelector('.bg-gradient-to-r').style.width = `${data.left}%`;
        }, 100);
      });

      // 추천 꿀조합 (jobs) 렌더링 복구
      const jobsContainer = document.getElementById('jobs-container');
      jobsContainer.innerHTML = '';
      if(detail.jobs) {
        detail.jobs.forEach(job => {
          const li = document.createElement('li');
          // 카드가 분리됨에 따라 디자인에 맞게 배경색(bg-slate-50) 수정
          li.className = "bg-slate-50 p-4 rounded-xl flex flex-col gap-1"; 
          li.innerHTML = `
            <span class="font-bold text-slate-800 text-[15px]">${job.name}</span>
            <span class="text-xs text-slate-500 leading-normal">${job.reason}</span>
          `;
          jobsContainer.appendChild(li);
        });
      }
    }

    // 결과 화면 이미지 캡처 및 다운로드 로직
    async function handleImageDownload() {
      showToast('이미지를 생성 중입니다... ⏳');
      const captureArea = document.getElementById('capture-area');
      
      try {
        // html2canvas를 사용하여 DOM 영역을 캔버스로 변환
        const canvas = await html2canvas(captureArea, {
          scale: 2, // 텍스트 깨짐 방지를 위한 고해상도 렌더링
          backgroundColor: '#f1f5f9', // Tailwind bg-slate-100 배경색 지정
          useCORS: true, // 외부 폰트/이미지 렌더링 허용
          onclone: (clonedDoc) => {
            // [버그 픽스] 캡처 화면 렌더링 시 글씨 흐려짐/안보임 현상 방지
            // 복제된 캡처용 DOM에서 애니메이션을 강제로 끄고 최종 상태(opacity: 1)로 고정합니다.
            const animatedElements = clonedDoc.querySelectorAll('.animate-fade-in');
            animatedElements.forEach(el => {
              el.style.animation = 'none';
              el.style.opacity = '1';
              el.style.transform = 'translateY(0)';
            });
            
            // 추가 방어 코드: 텍스트 색상을 확실하게 고정
            const textElements = clonedDoc.querySelectorAll('p, span, h1, h2, h3, div');
            textElements.forEach(el => {
               if(window.getComputedStyle(el).color === 'rgba(0, 0, 0, 0)') {
                   el.style.color = '#334155'; // Tailwind text-slate-700
               }
            });
          }
        });
        
        // 캔버스를 이미지(Base64) URL로 변환
        const imgData = canvas.toDataURL('image/png');
        
        // 가상의 a 태그를 생성하여 다운로드 트리거
        const link = document.createElement('a');
        link.download = '캠퍼스_MBTI_결과.png';
        link.href = imgData;
        link.click();
        
        showToast('이미지가 기기에 저장되었습니다! 📸');
      } catch (error) {
        console.error('이미지 캡처 에러:', error);
        showToast('이미지 저장에 실패했습니다. 😭');
      }
    }

    // 내 결과값을 포함하여 공유하는 로직 (Web Share API)
    async function handleResultShare() {
      // 렌더링된 내 MBTI 유형과 타이틀 가져오기
      const currentMbti = document.getElementById('result-mbti').innerText;
      const currentTitle = document.getElementById('result-title').innerText;

      const shareData = {
        title: '간호대생 찐 공감 생존형 MBTI',
        text: `내 결과는 [${currentMbti} : ${currentTitle}]이야! 💉✨\n너의 간호학과 라이프스타일도 확인해봐!`,
        url: window.location.href // 현재 웹페이지 주소
      };

      // 모바일 기기(iOS, Android)에서 카카오톡 등 네이티브 공유 창 띄우기
      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          console.log('공유가 취소되었거나 실패했습니다.', err);
        }
      } else {
        // PC 등 지원하지 않는 환경에서는 클립보드에 링크와 결과 텍스트 복사
        copyToClipboard(`${shareData.text}\n${shareData.url}`);
        showToast('결과가 클립보드에 복사되었습니다! 🔗');
      }
    }

    // 클립보드 복사 함수 (중복 선언 및 열린 괄호 수정)
    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }

    // 토스트 메시지 함수 (파라미터로 동적 텍스트를 받도록 수정)
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message || '완료되었습니다!';
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, 2500);
    }

    // 처음으로 돌아가기
    function restartTest() {
      screenResult.classList.add('hidden-view');
      screenIntro.classList.remove('hidden-view');
      window.scrollTo(0,0);
    }
  </script>
</body>
